name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис POSIX sh (bootstrap)
        run: dash -n bootstrap.sh

      - name: shellcheck (bootstrap)
        run: shellcheck -s sh bootstrap.sh

      - name: Синтаксис Python
        run: python3 -m compileall -q install.py kit tests

      - name: smoke-тесты
        run: python3 tests/smoke.py
