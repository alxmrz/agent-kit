name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис POSIX sh
        run: |
          for f in install.sh bootstrap.sh lib/*.sh tests/smoke.sh; do
            dash -n "$f"
          done

      - name: shellcheck
        run: shellcheck -s sh install.sh bootstrap.sh lib/*.sh tests/smoke.sh

      - name: Синтаксис merge.py
        run: python3 -m py_compile lib/merge.py

      - name: smoke-тесты
        run: ./tests/smoke.sh
